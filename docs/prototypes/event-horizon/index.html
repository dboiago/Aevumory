<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aevumory · Event Horizon Prototype</title>
<style>
  :root {
    --metadata-opacity: .38;
    --safe-bottom: clamp(22px, 2.4vw, 42px);
    --safe-right: clamp(24px, 3vw, 54px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #111; color: #eee;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #horizon {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    isolation: isolate; background: #171716 center / cover no-repeat;
  }
  #horizon::before {
    content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
    background: linear-gradient(to bottom, rgba(0,0,0,.02) 0%, rgba(0,0,0,.03) 65%, rgba(0,0,0,.18) 100%);
  }
  #horizon::after {
    content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
    box-shadow: inset 0 0 clamp(36px, 6vw, 110px) rgba(0,0,0,.12);
  }
  #field {
    position:absolute; inset:0; z-index:1; pointer-events:none;
  }
  .event {
    position:absolute; left:0; top:0; max-width:min(38vw, 460px);
    color:rgba(255,255,255,var(--opacity));
    font-size:clamp(10px, calc(8px + var(--size) * 1vw), 25px);
    font-weight:var(--weight);
    letter-spacing:var(--tracking);
    line-height:1.08;
    white-space:nowrap;
    text-align:center;
    filter: blur(var(--blur));
    /* Soft local separation, not an outline. This keeps white type readable
       over lighter photography without introducing a UI treatment. */
    text-shadow:
      0 1px 3px rgba(0,0,0,.42),
      0 0 10px rgba(0,0,0,.18);
    transform: translate(-50%,-50%) scale(var(--scale));
    transform-origin:center;
    transition: none;
    will-change: transform, filter, color;
  }
  .event-title { display:block; }
  .event-time {
    display:block;
    margin-top:.18em;
    font-size:.68em;
    font-weight:400;
    letter-spacing:.08em;
    opacity:var(--time-opacity);
    transform:translateY(var(--time-rise)) scale(var(--time-scale));
    transform-origin:center top;
  }

  #metadata {
    position:absolute; right:var(--safe-right); bottom:var(--safe-bottom); z-index:3;
    color:rgba(255,255,255,var(--metadata-opacity));
    font-size:clamp(10px, 1.15vw, 18px);
    font-weight:400; letter-spacing:.12em; white-space:nowrap;
    transition: opacity 600ms ease;
    text-shadow:0 1px 10px rgba(0,0,0,.2);
  }
  #controls {
    position:absolute; left:18px; top:18px; z-index:10; width:min(390px, calc(100vw - 36px));
    padding:14px; border-radius:12px; background:rgba(12,12,12,.76);
    backdrop-filter: blur(14px); color:#eee; font-size:13px;
    opacity:.16; transition:opacity .2s ease;
  }
  #controls:hover, #controls:focus-within { opacity:1; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  .row label { min-width:74px; color:#bdbdbd; }
  button {
    border:1px solid rgba(255,255,255,.18); background:#222; color:#eee; border-radius:7px;
    padding:6px 9px; cursor:pointer; font:inherit;
  }
  button.active { background:#e9e5dc; color:#171717; }
  input[type="range"] { flex:1; min-width:170px; }
  .value { width:56px; text-align:right; color:#bdbdbd; font-variant-numeric:tabular-nums; }
  .hint { margin-top:9px; color:#8e8e8e; font-size:11px; line-height:1.4; }
  @media (max-width:700px) {
    #controls { opacity:.82; }
    .event { white-space:normal; max-width:42vw; }
  }
</style>
</head>
<body>
<main id="horizon">
  <div id="field"></div>
  <div id="metadata">Monday · 7:42 PM · 21°C</div>

  <section id="controls" aria-label="Prototype controls">
    <div class="row">
      <label>Photo</label>
      <button data-photo="portrait" class="active">Portrait</button>
      <button data-photo="landscape">Landscape</button>
      <button data-photo="interior">Interior</button>
    </div>
    <div class="row">
      <label>Events</label>
      <button data-count="0">0</button>
      <button data-count="1">1</button>
      <button data-count="3">3</button>
      <button data-count="5" class="active">5</button>
    </div>
    <div class="row">
      <label for="day">Simulation</label>
      <input id="day" type="range" min="0" max="168" value="72" step="1">
      <span id="dayValue" class="value"></span>
    </div>
    <div class="row">
      <label for="settle">Settling</label>
      <input id="settle" type="range" min="4" max="16" value="8" step="1">
      <span id="settleValue" class="value"></span>
    </div>
    <div class="hint">Seven-day Horizon. Distal events begin almost subliminally. The settling control changes how many hours before an event its name begins drifting downward and its time resolves.</div>
  </section>
</main>

<script>
const photos = {
  portrait: 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=2400&q=88',
  landscape: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2400&q=88',
  interior: 'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=2400&q=88'
};

const horizon = document.querySelector('#horizon');
const field = document.querySelector('#field');
const slider = document.querySelector('#day');
const value = document.querySelector('#dayValue');
const settle = document.querySelector('#settle');
const settleValue = document.querySelector('#settleValue');
let visibleCount = 5;
let photo = 'portrait';

// ageHours = hours since event entered the 6-day horizon.
// Each event remains continuous even between nominal day labels.
const events = [
  { id:'maya', title:'Maya arrives from Vancouver', time:'6:30 PM', offset:0, family:'left', phase:.17, bias:.04, arrivalLane:-.014 },
  { id:'morans', title:'Dinner with the Morans', time:'7:00 PM', offset:37, family:'right', phase:.61, bias:-.02, arrivalLane:.038 },
  { id:'tournament', title:"Alex's tournament", time:'9:15 AM', offset:71, family:'left', phase:.83, bias:.025, arrivalLane:.012 },
  { id:'train', title:'Train to Montreal', time:'2:40 PM', offset:111, family:'right', phase:.29, bias:-.035, arrivalLane:.055 },
  { id:'maya-arrival', title:'Maya arrives', time:'6:30 PM', offset:143, family:'right', phase:.47, bias:.012, arrivalLane:-.042 }
];

const nodes = events.map((event) => {
  const node = document.createElement('div');
  node.className = 'event';
  const title = document.createElement('span');
  title.className = 'event-title';
  title.textContent = event.title;
  const time = document.createElement('span');
  time.className = 'event-time';
  time.textContent = event.time;
  node.append(title, time);
  field.appendChild(node);
  return { event, node };
});

function clamp(v, a=0, b=1) { return Math.max(a, Math.min(b, v)); }
function lerp(a,b,t){ return a + (b-a)*t; }
function smoothstep(t){ t=clamp(t); return t*t*(3-2*t); }

// Low-left and low-right ingress curves. Curves are intentionally asymmetric.
// Deterministic event-specific phase/bias prevents left-right-left-right symmetry.
function trajectory(event, p, horizonHours, settlingHours) {
  const side = event.family === 'right' ? 1 : -1;

  // Each event owns a deterministic ingress and middle-field character.
  // The middle is a field, not a shared destination.
  const distalX = side < 0
    ? .035 + event.phase*.18 + event.bias*.4
    : .965 - event.phase*.18 + event.bias*.4;
  const distalY = .945 - event.phase*.075;

  const middleX = clamp(.23 + event.phase*.54 + event.bias*1.5, .20, .80);
  const middleY = .755 + Math.sin((event.phase*1.7 + .19)*Math.PI)*.055 + event.arrivalLane*.35;

  const arrivalX = clamp(.42 + event.phase*.16 + event.bias*.55, .36, .64);
  const arrivalY = .885 + event.arrivalLane;

  const settleStart = clamp(1 - settlingHours / horizonHours);

  // Ingress resolves at different rates per event. This deliberately breaks
  // the obvious shared parabola while remaining deterministic.
  const inwardEnd = .54 + event.phase*.18;
  const inward = smoothstep(p / inwardEnd);
  let x = lerp(distalX, middleX, inward);

  const verticalEnd = .38 + event.phase*.16;
  let y = lerp(distalY, middleY, smoothstep(p / verticalEnd));

  // A subtle central reservation: events do not all choose the exact visual
  // centre while approaching. This is not collision avoidance and causes no
  // reactive jumping; it is part of each event's natural path.
  const centerPressure = Math.pow(smoothstep((p-.34)/.40), 1.2) * (1-smoothstep((p-settleStart+.04)/.10));
  const centerOffset = (event.phase-.5) * .075 + event.bias*.8;
  x += centerOffset * centerPressure;
  y += Math.abs(event.phase-.5) * .018 * centerPressure;

  if (p > settleStart) {
    const q = smoothstep((p - settleStart) / (1 - settleStart));
    x = lerp(x, arrivalX, q);
    y = lerp(y, arrivalY, q);
  }

  // Low-amplitude deterministic motion avoids rails without introducing
  // random render-to-render movement.
  x += Math.sin((p*6.1 + event.phase*11.7))*0.010*(1-p);
  y += Math.cos((p*5.2 + event.phase*8.3))*0.006*(1-p);

  return {x:clamp(x,.035,.965), y:clamp(y,.72,.95)};
}

function visual(p, horizonHours, settlingHours) {
  const settleStart = clamp(1 - settlingHours / horizonHours);

  // Deliberately slow early resolution. At the edge of the Horizon the event
  // should read more like atmospheric texture than legible interface text.
  const readable = smoothstep((p-.08)/.82);
  const timeRevealStart = settleStart + (1 - settleStart) * .34;
  const timeProgress = smoothstep((p - timeRevealStart) / (1 - timeRevealStart));

  return {
    opacity: lerp(.09, .98, Math.pow(readable, .92)),
    size: lerp(.24, 1.46, Math.pow(p, .64)),
    scale: lerp(.76, 1, smoothstep((p-.04)/.96)),
    blur: lerp(2.2, 0, Math.pow(p, .82)),
    tracking: lerp(.27, .012, Math.pow(p, .72)).toFixed(3)+'em',
    weight: Math.round(lerp(260, 500, Math.pow(p, .90))),
    timeOpacity: lerp(0, .84, timeProgress),
    timeScale: lerp(.84, 1, timeProgress),
    timeRise: lerp(-.38, 0, timeProgress).toFixed(3)+'em',
    imminent: timeProgress
  };
}

function label(hoursUntil) {
  if (hoursUntil <= 0) return 'Now';
  if (hoursUntil < 24) return Math.ceil(hoursUntil) + 'h';
  return Math.ceil(hoursUntil/24) + 'd';
}

function render() {
  const now = Number(slider.value);
  const horizonHours = 168;
  const settlingHours = Number(settle.value);
  value.textContent = label(horizonHours-now);
  settleValue.textContent = settlingHours + 'h';

  const rendered = [];
  nodes.forEach(({event,node}, index) => {
    const show = index < visibleCount;
    node.style.display = show ? 'block' : 'none';
    if (!show) return;

    const age = (now + event.offset) % horizonHours;
    const p = age / horizonHours;
    const pos = trajectory(event,p,horizonHours,settlingHours);
    const v = visual(p,horizonHours,settlingHours);

    rendered.push({event,node,p,v,x:pos.x,y:pos.y});
  });

  rendered.forEach(item => {
    const {node,v,x,y}=item;
    node.style.left = (x*100).toFixed(3)+'%';
    node.style.top = (y*100).toFixed(3)+'%';
    node.style.setProperty('--opacity', v.opacity.toFixed(3));
    node.style.setProperty('--size', v.size.toFixed(3));
    node.style.setProperty('--scale', v.scale.toFixed(3));
    node.style.setProperty('--blur', v.blur.toFixed(2)+'px');
    node.style.setProperty('--tracking', v.tracking);
    node.style.setProperty('--weight', v.weight);
    node.style.setProperty('--time-opacity', v.timeOpacity.toFixed(3));
    node.style.setProperty('--time-scale', v.timeScale.toFixed(3));
    node.style.setProperty('--time-rise', v.timeRise);
  });
}

function setPhoto(name) {
  photo=name;
  horizon.style.backgroundImage = "url('"+photos[name]+"')";
  document.querySelectorAll('[data-photo]').forEach(b=>b.classList.toggle('active', b.dataset.photo===name));
}

document.querySelectorAll('[data-photo]').forEach(button => button.addEventListener('click',()=>setPhoto(button.dataset.photo)));
document.querySelectorAll('[data-count]').forEach(button => button.addEventListener('click',()=>{
  visibleCount=Number(button.dataset.count);
  document.querySelectorAll('[data-count]').forEach(b=>b.classList.toggle('active', Number(b.dataset.count)===visibleCount));
  render();
}));
slider.addEventListener('input', render);
settle.addEventListener('input', render);

setPhoto(photo);
render();
</script>
</body>
</html>
